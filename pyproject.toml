[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "wkb_wkt_converter"
dynamic = ["version"]
requires-python = ">=3.8"
description = "High-performance streaming converter between WKT and WKB geometry formats"
readme = "README.md"
license = { text = "MIT" }
keywords = ["wkb", "wkt", "ewkb", "ewkt", "gis", "geospatial", "geometry"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Repository = "https://github.com/adrien-berchet/wkb_wkt_converter"
Issues = "https://github.com/adrien-berchet/wkb_wkt_converter/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "wkb_wkt_converter"
manifest-path = "wkb_wkt_converter_py/Cargo.toml"

[project.optional-dependencies]
asv = ["asv>=0.6.5", "virtualenv"]
benchmark = ["pytest-benchmark", "shapely"]
test = ["hypothesis", "pytest", "shapely"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipython>=8.12.3",
    "pdbpp>=0.12.1",
]
