name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Check tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(cargo pkgid --package wkb_wkt_converter | sed 's/.*#//')"

          if [[ "${manifest_version}" != "${tag_version}" ]]; then
            echo "::error title=Release version mismatch::Tag ${GITHUB_REF_NAME} points to wkb_wkt_converter ${manifest_version}. Update [workspace.package] version to ${tag_version} before creating the tag."
            exit 1
          fi

  build-sdist:
    name: Build sdist
    needs: validate-release-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          maturin-version: v1.11.5
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*
          if-no-files-found: error

  build-linux-wheels:
    name: Build Linux wheel (${{ matrix.python-version }})
    needs: validate-release-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.11.5
          manylinux: "2014"
          args: >-
            --release
            --locked
            --strip
            --out dist
            --compatibility pypi
            -i python${{ matrix.python-version }}

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import wkb_wkt_converter

          wkb = wkb_wkt_converter.wkt_to_wkb("POINT (1 2)")
          assert wkb_wkt_converter.wkb_to_wkt(wkb) == "POINT (1 2)"
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-linux-x86_64-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  build-x64-native-wheels:
    name: Build ${{ matrix.platform.name }} wheel (${{ matrix.python-version }})
    needs: validate-release-version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        platform:
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.11.5
          args: >-
            --release
            --locked
            --strip
            --out dist
            --compatibility pypi
            -i python

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import wkb_wkt_converter

          wkb = wkb_wkt_converter.wkt_to_wkb("POINT (1 2)")
          assert wkb_wkt_converter.wkb_to_wkt(wkb) == "POINT (1 2)"
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform.name }}-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  build-macos-arm64-wheels:
    name: Build macos-arm64 wheel (${{ matrix.python-version }})
    needs: validate-release-version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.11.5
          args: >-
            --release
            --locked
            --strip
            --out dist
            --compatibility pypi
            -i python

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import wkb_wkt_converter

          wkb = wkb_wkt_converter.wkt_to_wkb("POINT (1 2)")
          assert wkb_wkt_converter.wkb_to_wkt(wkb) == "POINT (1 2)"
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-macos-arm64-py${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  build-pypy-wheels:
    name: Build PyPy ${{ matrix.platform.name }} wheel (${{ matrix.pypy-version }})
    needs: validate-release-version
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        pypy-version: ["3.11"]
        platform:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Set up PyPy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: pypy${{ matrix.pypy-version }}

      - name: Build manylinux wheel
        if: matrix.platform.name == 'linux-x86_64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.11.5
          manylinux: "2014"
          args: >-
            --release
            --locked
            --strip
            --out dist
            --compatibility pypi
            -i pypy${{ matrix.pypy-version }}

      - name: Build native wheel
        if: matrix.platform.name != 'linux-x86_64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.11.5
          args: >-
            --release
            --locked
            --strip
            --out dist
            --compatibility pypi
            -i python

      - name: Smoke test wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import wkb_wkt_converter

          wkb = wkb_wkt_converter.wkt_to_wkb("POINT (1 2)")
          assert wkb_wkt_converter.wkb_to_wkt(wkb) == "POINT (1 2)"
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.platform.name }}-pypy${{ matrix.pypy-version }}
          path: dist/*
          if-no-files-found: error

  publish-crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-sdist
      - build-linux-wheels
      - build-x64-native-wheels
      - build-macos-arm64-wheels
      - build-pypy-wheels
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/wkb_wkt_converter
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --package wkb_wkt_converter --locked

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-sdist
      - build-linux-wheels
      - build-x64-native-wheels
      - build-macos-arm64-wheels
      - build-pypy-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wkb-wkt-converter/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -l dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
