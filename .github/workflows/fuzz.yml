name: Fuzz

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-targets:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: List fuzz targets
        id: targets
        run: echo "targets=$(python3 scripts/list_fuzz_targets.py --json)" >> "$GITHUB_OUTPUT"

  cargo-fuzz:
    name: cargo-fuzz (${{ matrix.target }})
    needs: fuzz-targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.1

      - name: Run bounded fuzz target
        working-directory: fuzz
        run: |
          mkdir -p "corpus/${{ matrix.target }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- -max_total_time=300
          else
            cargo fuzz run "${{ matrix.target }}" "corpus/${{ matrix.target }}" "seeds/${{ matrix.target }}" -- -runs=1000
          fi

      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 7
